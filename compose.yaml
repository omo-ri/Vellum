name: vellum

# 本地开发只用 docker 跑 Postgres。Go 与 Vite 跑在宿主机上，以获得完整的热重载速度。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required (cp .env.example .env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (cp .env.example .env)}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required (cp .env.example .env)}
    ports:
      - "${DB_PORT:?DB_PORT is required (cp .env.example .env)}:5432"
    volumes:
      # named volume 而不是 bind mount：数据留在 WSL 的 ext4 上，不受 /mnt/z 的 9p 拖累。
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
